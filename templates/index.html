<!DOCTYPE HTML>
<html>
<head>
    <title>GaryDavid Chat God App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg==" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-textfill@0.6.0/source/jquery.textfill.min.js"></script>
    <script src="{{ url_for('static', filename='js/kick-chat.js') }}"></script>
    <script type="text/javascript" charset="utf-8">
        const KICK_CHANNEL = "{{ kick_channel }}";
        const KICK_CHATROOM_ID = "{{ kick_chatroom_id }}";

        function titleCaseName(name) {
            name = String(name || '').trim();
            if (!name) return 'No User';
            return name[0].toUpperCase() + name.slice(1);
        }

        function updateStatus(msg) {
            if (!msg) return;
            const source = msg.source || 'app';
            const level = msg.level || 'info';
            const message = msg.message || msg.state || '';
            $('#status').text(`[${source}] ${message}`).attr('data-level', level);
        }

        function resizeUserBox(userNumber) {
            $('#user-name-box-' + userNumber).textfill({ minFontPixels: 2, maxFontPixels: 50, explicitHeight: 60 });
            $('#user-message-box-' + userNumber).textfill({ minFontPixels: 2, maxFontPixels: 30 });
        }

        $(document).ready(function() {
            const socket = io();

            socket.on('connect', function() {
                updateStatus({ source: 'socket', level: 'info', message: 'Connected to local app.' });
            });
            socket.on('disconnect', function() {
                updateStatus({ source: 'socket', level: 'error', message: 'Disconnected from local app.' });
            });
            socket.on('connect_error', function(err) {
                updateStatus({ source: 'socket', level: 'error', message: 'Socket connection error: ' + err.message });
            });
            socket.on('status', updateStatus);

            socket.on('message_send', function(msg, cb) {
                if (!msg || !['1', '2', '3'].includes(String(msg.user_number))) return;
                const userNumber = String(msg.user_number);
                $('#user-message-' + userNumber).text(msg.message || '');
                $('#user-name-' + userNumber).text(titleCaseName(msg.current_user));
                resizeUserBox(userNumber);
                if (cb) cb();
            });

            const kickChat = new KickChat(KICK_CHANNEL, { chatroomId: KICK_CHATROOM_ID });
            kickChat.on('status', function(data) {
                updateStatus({ source: 'kick', level: 'info', message: data.message || data.state });
                socket.emit('kick_status', { level: 'info', message: data.message || data.state });
            });
            kickChat.on('connected', function(data) {
                updateStatus({ source: 'kick', level: 'info', message: data.message || 'Connected to Kick chat.' });
                socket.emit('kick_status', { level: 'info', message: data.message || 'Connected to Kick chat.' });
            });
            kickChat.on('error', function(data) {
                updateStatus({ source: 'kick', level: 'error', message: data.message });
                socket.emit('kick_status', { level: 'error', message: data.message });
            });
            kickChat.on('message', function(data) {
                socket.emit('kick_message', { author: data.author, text: data.text, raw: data.raw });
            });
            kickChat.connect();

            $('form.pick-random').submit(function() {
                socket.emit('pickrandom', { user_number: String($(this).data('user-number')) });
                return false;
            });

            $('.tts-checkbox').change(function() {
                socket.emit('tts', { user_number: String($(this).data('user-number')), checked: $(this).prop('checked') });
                return false;
            });

            $('form.choose-box').submit(function() {
                const userNumber = String($(this).data('user-number'));
                const input = $(this).find('input');
                const chosenUser = input.val().trim();
                if (!chosenUser) {
                    updateStatus({ source: 'ui', level: 'warning', message: 'Choose User cannot be empty.' });
                    return false;
                }
                socket.emit('choose', { user_number: userNumber, chosen_user: chosenUser });
                input.val('');
                return false;
            });

            $('.voice-name').change(function() {
                socket.emit('voicename', { user_number: String($(this).data('user-number')), voice_name: $(this).val() });
            });
            $('.voice-style').change(function() {
                socket.emit('voicestyle', { user_number: String($(this).data('user-number')), voice_style: $(this).val() });
            });
        });
    </script>
</head>
<body>
    <h1>Holy Chat God Selector</h1>
    <div id="status" data-level="info">Starting ChatGodApp for kick.com/{{ kick_channel }}...</div>
    <div class="players">
        {% for user_number in ['1', '2', '3'] %}
        <div class="player-panel">
            <form id="pickrandom{{ user_number }}" class="pick-random" data-user-number="{{ user_number }}" method="POST" action="#">
                <input type="submit" value="Pick Random" class="pick-random-input">
            </form>
            <form id="tts{{ user_number }}" method="POST" action="#">
                <label for="checkbox{{ user_number }}">TTS {{ user_number }}:</label>
                <input id="checkbox{{ user_number }}" data-user-number="{{ user_number }}" type="checkbox" class="tts-checkbox" value="tts" name="tts" checked>
            </form>
            <form id="choose{{ user_number }}" class="choose-box" data-user-number="{{ user_number }}" method="POST" action="#">
                <label for="choose-user-{{ user_number }}">Choose User:</label>
                <input id="choose-user-{{ user_number }}" type="text" class="choose" autocomplete="off">
            </form>
            <div class="voice-controls">
                <select id="voicename{{ user_number }}" class="voice-name" data-user-number="{{ user_number }}">
                  <option value="en-US-DavisNeural">Davis</option>
                  <option value="en-US-TonyNeural">Tony</option>
                  <option value="en-US-JasonNeural">Jason</option>
                  <option value="en-US-GuyNeural">Guy</option>
                  <option value="en-US-JaneNeural">Jane</option>
                  <option value="en-US-NancyNeural">Nancy</option>
                  <option value="en-US-JennyNeural">Jenny</option>
                  <option value="en-US-AriaNeural">Aria</option>
                </select>
                <select id="voicestyle{{ user_number }}" class="voice-style" data-user-number="{{ user_number }}">
                  <option value="random">random</option>
                  <option value="angry">angry</option>
                  <option value="cheerful">cheerful</option>
                  <option value="excited">excited</option>
                  <option value="hopeful">hopeful</option>
                  <option value="sad">sad</option>
                  <option value="shouting">shouting</option>
                  <option value="terrified">terrified</option>
                  <option value="unfriendly">unfriendly</option>
                  <option value="whispering">whispering</option>
                </select>
            </div>
            <div class="user-name-box" id="user-name-box-{{ user_number }}">
                <span class="user-name" id="user-name-{{ user_number }}">Temp User</span>
            </div>
            <div class="user-message-box" id="user-message-box-{{ user_number }}">
                <span class="user-message" id="user-message-{{ user_number }}">Temp message</span>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
